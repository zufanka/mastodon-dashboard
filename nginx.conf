user www-data;
worker_processes 1;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;

    server {
        listen 80 default_server;
        server_name _;
        root /data/public;
        add_header Cache-Control "no-store" always;

        location = / {
            try_files /index.html @waiting;
        }
        location = /index.html {
            try_files $uri @waiting;
        }
        location @waiting {
            default_type text/plain;
            return 503 "Waiting for first collection. Run the poll-mastodon scheduled job in Dokploy.\n";
        }
        location / {
            return 404;
        }
    }
}
